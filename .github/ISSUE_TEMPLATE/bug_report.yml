name: Bug report
description: Report a problem with the DMF template, schema, or example
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the issue.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - "template/README.md"
        - "template/AGENTS.md"
        - "template/agent-manifest.json"
        - "template/agent-manifest.schema.json"
        - "examples/buntas-tofu/"
        - "Top-level documentation (README, CONTRIBUTING, SECURITY, etc.)"
        - "Other / multiple / not sure"
    validations:
      required: true
  - type: input
    id: dmf_version
    attributes:
      label: DMF version or commit SHA
      placeholder: "e.g., v1.0.0 or a7d2133"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Steps, manifest snippet, or directive that triggers the issue.
    validations:
      required: true
