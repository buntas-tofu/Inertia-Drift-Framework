# The board's declaration. Not a card store.

schema = 1
name = "DMF project board"
id = "board"
owner = "operator"
created = "2026-08-01"

# The flight. A card's state mirrors the directory it sits in, and validate
# checks that rather than trusting it. Order is the order work flows.
columns = ["inbox", "shaping", "ready", "active", "blocked", "review", "done"]

# Planning depth, not a column and not a lane.
horizons = ["near", "medium", "long"]

# The classification axis, and it NESTS. A lane path is slash separated, every
# ancestor must be declared, and its level must match its depth. Add a level
# here and declare lanes at that depth; nothing in the tool assumes a count.
lane_levels = ["area", "topic"]
lanes_file = "lanes.toml"

# Where a relative link in a card resolves from. This board ships in a
# subdirectory, so its links point at the repository root. A board at the root
# would use "." here.
link_base = ".."

# Where work can be dropped without losing the record that it was tried.
terminal_states = ["done"]

# A card can be waiting on a person rather than on another card. This is how
# outstanding rulings get found instead of remembered.
awaiting_values = ["", "operator", "contributor", "external"]

# The reading. Regenerated by `python3 tools/board.py index`.
generated = ["BOARD.md", "index/board.json"]
